# CI: build only.
name: ci
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Web build
        working-directory: app
        run: flutter build web --release
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: postgres
          POSTGRES_DB: pontual_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      HOST: 127.0.0.1
      PORT: 8080
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/pontual_test?sslmode=disable
      ALLOWED_ORIGINS: http://127.0.0.1:8080
      TRUST_CLOUDFLARE: "false"
      DATA_DIR: ./build
      LOG_LEVEL: info
      METRICS_PORT: 127.0.0.1:9091
      LINES_JSON: '[{"id":7,"isActive":true}]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.7
      - name: Install dbmate
        run: |
          curl -fsSL -o /tmp/dbmate https://github.com/amacneil/dbmate/releases/download/v2.36.0/dbmate-linux-amd64
          chmod +x /tmp/dbmate
          /tmp/dbmate --version
      - name: Migrate test database
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/pontual_test?sslmode=disable
        run: /tmp/dbmate -d ./db/migrations up
      - name: Server start check
        working-directory: server
        run: |
          (deno task start > /tmp/pontual-server.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/v1/health || (echo "--- server log ---"; tail -n 80 /tmp/pontual-server.log; exit 1)
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.7
      - name: Data build
        working-directory: tools
        run: deno task data-build
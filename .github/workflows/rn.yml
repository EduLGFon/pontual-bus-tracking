# RN CI: typecheck, lint, tests, web export.
name: rn
on:
  pull_request:
    paths:
      - "rn/**"
      - ".github/workflows/rn.yml"
  push:
    branches: [rn]
    paths:
      - "rn/**"
      - ".github/workflows/rn.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288fc382d7dabbcebbb229195945e045 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rn/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest --ci --coverage=false
      - run: npx expo export --platform web

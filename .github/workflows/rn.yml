# RN CI: typecheck, lint, tests.
name: rn
on:
  pull_request:
    paths:
      - "rn/**"
      - ".github/workflows/rn.yml"
  push:
    branches: [rn]
    paths:
      - "rn/**"
      - ".github/workflows/rn.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx expo lint
      - run: bunx jest --ci --coverage=false
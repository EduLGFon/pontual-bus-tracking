# Build performance for small developer machines (4 cores / 16 GiB).
# The Flutter template's 8 GiB heap plus 4 GiB metaspace caused swapping.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Flutter 3.47's compileFlutterBuild* tasks call Task.project at execution,
# which Gradle rejects with the configuration cache. Keep it off.
org.gradle.configuration-cache=false
org.gradle.vfs.watch=true
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

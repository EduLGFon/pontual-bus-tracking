
name: pontual
description: "Pontual independent crowd-sourced bus tracker for Sao Mateus, ES, Brazil."
publish_to: "none"
version: 0.3.6+0.3.6

environment:
  sdk: ^3.13.5

dependencies:
  battery_plus: ^7.1.2
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.5.0
  geolocator: ^14.1.1
  go_router: ^18.1.4
  http: ^1.6.0
  latlong2: ^0.10.1
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  stream_channel: ^2.1.4

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
          weight: 400
  assets:
    - assets/data/
    - assets/data/routes/
    - assets/fonts/
    - assets/map/

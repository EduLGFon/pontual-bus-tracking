    #splash svg{width:88px;height:88px;animation:p 1.6s ease-in-out infinite}
    @keyframes p{50%{opacity:.55}}
    @media (prefers-reduced-motion:reduce){#splash svg{animation:none}}
  </style>

  <meta name="theme-color" content="#0A1110" media="(prefers-color-scheme: dark)">

    * https://docs.flutter.dev/platform-integration/web/initialization

  <script>
    // Remove the inline splash as soon as the first Flutter frame is ready.
    (function () {
      function hideSplash() {
        var s = document.getElementById('splash');
        if (s && s.parentNode) { s.parentNode.removeChild(s); }
      }
      window.addEventListener('flutter-first-frame', hideSplash);
      // Safety net: never leave the splash covering the app.
      setTimeout(hideSplash, 8000);
    })();
  </script>

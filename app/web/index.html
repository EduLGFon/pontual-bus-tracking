<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path that you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Veja onde o ônibus está em São Mateus. Quem está dentro compartilha a posição, de forma anônima. Sem cadastro, sem anúncios.">

  <!-- Inline splash: paints in the first frame with no network, removed on
       the first Flutter frame. See docs/ui/UI_SPEC.md 8. -->
  <style>
    html,body{margin:0;height:100%;background:#F6F5F1}
    @media (prefers-color-scheme:dark){html,body{background:#0A1110}}
    #splash{position:fixed;inset:0;display:grid;place-items:center}
    #splash svg{width:88px;height:88px;animation:p 1.6s ease-in-out infinite}
    @keyframes p{50%{opacity:.55}}
    @media (prefers-reduced-motion:reduce){#splash svg{animation:none}}
  </style>

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A1110" media="(prefers-color-scheme: dark)">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pontual">
  <link rel="apple-touch-icon" href="icons/Icon-apple-touch-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pontual - ônibus ao vivo em São Mateus</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="48" height="48" rx="12" fill="#0B3D36"/>
      <path d="M12 18h24v12a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V18Z" stroke="#62E8B0" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M17 22h14v6H17z" stroke="#62E8B0" stroke-width="2" stroke-linejoin="round"/>
      <path d="M17 33v2M31 33v2" stroke="#62E8B0" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful if you need to provide a custom configuration to the Flutter loader.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Remove the inline splash as soon as the first Flutter frame is ready.
    (function () {
      function hideSplash() {
        var s = document.getElementById('splash');
        if (s && s.parentNode) { s.parentNode.removeChild(s); }
      }
      window.addEventListener('flutter-first-frame', hideSplash);
      // Safety net: never leave the splash covering the app.
      setTimeout(hideSplash, 8000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

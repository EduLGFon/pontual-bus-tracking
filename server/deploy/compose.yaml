# Pontual stack: PostgreSQL, one-shot migrations, API, and Cloudflare tunnel.
# Run from this directory:
#   docker compose up -d --build
# No service publishes a host port. The tunnel reaches api:8080 on the
# internal edge network. See docs/runbooks/docker.md and DECISIONS.md D101 and D102.
name: pontual-api # kept for volume continuity; do not rename

services:
  db:
    # Pinned minor version. The Debian (not Alpine) variant provides openssl
    # for the TLS certificate generated by the init script.
    image: postgres:16.15
    env_file:
      - ${PONTUAL_DB_ENV_FILE:-../.env.db}
    environment:
      POSTGRES_USER: pontual_migrator
      POSTGRES_DB: pontual
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pontual-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # No ports: the database is reachable only on the private compose network.
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    ulimits:
      core: 0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Forward-only migrations, then exit. `up` applies pending migrations
  # before the API starts. dbmate uses the schema-owner role, never the API.
  migrate:
    image: amacneil/dbmate:2.36.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
          set -eu
          : "$${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
          export DATABASE_URL="postgresql://pontual_migrator:$${POSTGRES_PASSWORD}@db:5432/pontual?sslmode=require"
          exec /usr/local/bin/dbmate \
            --wait --wait-timeout 60s \
            --migrations-dir /migrations \
            --no-dump-schema \
            up
    env_file:
      - ${PONTUAL_DB_ENV_FILE:-../.env.db}
    volumes:
      - ../db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: "no"
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
    image: pontual-api:${PONTUAL_TAG:-local}
    env_file:
      - ${PONTUAL_ENV_FILE:-../.env}
    environment:
      # Inside the container the API must listen on all interfaces; it is not
      # published on the host. The tunnel reaches it on the internal edge
      # network at api:8080.
      HOST: 0.0.0.0
      PORT: "8080"
      DATA_DIR: /app/build
      # Internal metrics listener only. It is not published.
      METRICS_PORT: 127.0.0.1:9091
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    # No core dump: live positions must not reach disk (PLAN 12.8).
    ulimits:
      core: 0
      nofile:
        soft: 4096
        hard: 8192
    restart: unless-stopped
    stop_grace_period: 20s
    networks:
      - edge
      - data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    command: [
      "tunnel",
      "--no-autoupdate",
      "--config",
      "/etc/cloudflared/config.yml",
      "--metrics",
      "127.0.0.1:2000",
      "run",
    ]
    configs:
      - source: cloudflared_config
        target: /etc/cloudflared/config.yml
    secrets:
      - cloudflared_credentials
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=4m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - edge
      - egress
    healthcheck:
      test: [
        "CMD",
        "cloudflared",
        "tunnel",
        "--metrics",
        "127.0.0.1:2000",
        "ready",
      ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pontual-db:

networks:
  edge:
    internal: true
  data:
    internal: true
  egress:

# Config is non-secret and world-readable 0644/0444, or owner uid 65532 with owner-read;
# credentials JSON must be
# owned by uid 65532 and readable by it (0400).
configs:
  cloudflared_config:
    file: ${PONTUAL_TUNNEL_CONFIG_FILE:-../secrets/cloudflared.yml}

secrets:
  cloudflared_credentials:
    file: ${PONTUAL_TUNNEL_CREDENTIALS_FILE:-../secrets/cloudflared_credentials.json}
